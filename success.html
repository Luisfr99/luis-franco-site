<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent — Luis Franco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE4; --ink: #14110E; --amber: #A85E1A; --muted: #7A6E62;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px;
    text-align: center;
  }
  .check {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--amber);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 32px;
    animation: popIn .5s cubic-bezier(.16,1,.3,1) both;
  }
  .check svg { width: 28px; height: 28px; color: white; }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(40px, 6vw, 72px);
    font-weight: 800; letter-spacing: -2px;
    margin-bottom: 20px;
    animation: fadeUp .7s .2s cubic-bezier(.16,1,.3,1) both;
  }
  p {
    font-size: 17px; font-weight: 300; color: var(--muted);
    max-width: 420px; line-height: 1.8; margin-bottom: 48px;
    animation: fadeUp .7s .35s cubic-bezier(.16,1,.3,1) both;
  }
  a {
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
    background: var(--ink); color: var(--bg);
    padding: 14px 28px; border-radius: 6px;
    text-decoration: none; letter-spacing: .3px;
    transition: background .2s;
    animation: fadeUp .7s .5s cubic-bezier(.16,1,.3,1) both;
    display: inline-block;
  }
  a:hover { background: var(--amber); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  a.logo {
    position: fixed; top: 24px; left: 32px;
    font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800;
    color: #14110E !important; text-decoration: none;
    letter-spacing: -0.5px;
    background: none !important;
    padding: 0 !important;
    border-radius: 0 !important;
    display: inline;
    transition: color .2s;
  }
  a.logo:hover { color: #A85E1A !important; background: none !important; }
  .sq { display:inline-block; width:7px; height:7px; background:var(--amber); margin-left:1px; vertical-align:middle; position:relative; top:-2px; }
</style>
</head>
<body>
  <a href="/" class="logo">LF<span class="sq"></span></a>

  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <h1>Message received.</h1>
  <p>Thanks for reaching out. I'll get back to you as soon as I can — usually within a day or two.</p>
  <a href="/">← Back to the site</a>
</body>
</html>
